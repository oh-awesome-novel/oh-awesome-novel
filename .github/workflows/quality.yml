name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Source ref to check before packaging
        required: false
        type: string
    outputs:
      commit:
        description: Exact source commit that passed the quality gate
        value: ${{ jobs.quality.outputs.commit }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    env:
      NX_DAEMON: "false"
      NX_NO_CLOUD: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Record source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --replace-registry-host=registry.npmmirror.com

      - name: Build, typecheck, test and verify documentation
        run: npm run quality
